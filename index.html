<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <script src="js.js"></script>
    <link rel="stylesheet" href="css.css">
</head>
<body> 
    <div id="calculadora">

        <input id="resultado" disabled>

        <div id="botoes">   
            <button class="orange" onclick="clean()">C</button> 
            <button class="orange" disabled>()</button> 
            <button class="orange" disabled>%</button> 
            <button class="orange" onclick="insertToDisplay('/')">÷</button> 

            <button onclick="insertToDisplay('7')">7</button>
            <button onclick="insertToDisplay('8')">8</button>
            <button onclick="insertToDisplay('9')">9</button>
            <button class="orange" onclick="insertToDisplay('*')">×</button>

            <button onclick="insertToDisplay('4')">4</button>
            <button onclick="insertToDisplay('5')">5</button>
            <button onclick="insertToDisplay('6')">6</button>
            <button class="orange" onclick="insertToDisplay('-')">-</button>  

            <button onclick="insertToDisplay('1')">1</button>
            <button onclick="insertToDisplay('2')">2</button> 
            <button onclick="insertToDisplay('3')">3</button> 
            <button class="orange" onclick="insertToDisplay('+')">+</button> 

            <button id="zero" onclick="insertToDisplay('0')">0</button> 
            <button class="orange" onclick="insertToDisplay('.')">.</button> 
            <button class="orange" onclick="back()">⌫</button> 
            <button class="orange" onclick="result()">=</button>  
        </div>
    </div>

    <div id="cores">
        <button onclick="trocarcor('blue')">Azul</button>
        <button onclick="trocarcor('red')">Vermelho</button>
        <button onclick="trocarcor('purple')">Roxo</button>
        <button onclick="trocarcor('green')">Verde</button>
        <button onclick="trocarcor('gold')">Dourado</button>
        <button onclick="trocarcor('black')">Preto</button>
        <button onclick="trocarcor('white')">Branco</button>
        <button onclick="trocarcor('orange')">Laranja</button>
    </div>
</body>
</html>
